<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Brightloop</title>
    <!-- first visit of a tab session shows the splash: paint the page dark right away so there is no white flash before it mounts -->
    <script>try{if(!sessionStorage.getItem("bl_splash"))document.documentElement.classList.add("boot")}catch(e){}</script>
    <style>html.boot,html.boot body{background:#000}</style>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body class="font-sans">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
