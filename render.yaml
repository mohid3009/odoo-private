# Render Blueprint: one Docker web service (API + built React app). Database is Neon (DATABASE_URL), auth is Firebase.
# Secrets marked `sync: false` are asked for once in the Render dashboard on first deploy.
services:
  - type: web
    name: brightloop
    runtime: docker
    plan: starter
    healthCheckPath: /api/healthz
    envVars:
      - { key: DEBUG, value: "false" }
      - { key: LOCAL_PASSWORD_AUTH, value: "false" }
      - { key: ODOO_ENABLED, value: "false" }
      - { key: DJANGO_SECRET_KEY, generateValue: true }
      - { key: DATABASE_URL, sync: false }          # Neon connection string (direct, not pooled), ends with ?sslmode=require
      - { key: FIREBASE_PROJECT_ID, sync: false }
      - { key: STAFF_SIGNUP_CODE, sync: false }
      - { key: ADMIN_SIGNUP_CODE, sync: false }
      # public web config of the Firebase app, baked into the React build
      - { key: VITE_FIREBASE_API_KEY, sync: false }
      - { key: VITE_FIREBASE_AUTH_DOMAIN, sync: false }
      - { key: VITE_FIREBASE_PROJECT_ID, sync: false }
      - { key: VITE_FIREBASE_APP_ID, sync: false }
      # optional: real email (leave EMAIL_HOST empty to keep the console backend)
      - { key: EMAIL_BACKEND, value: "django.core.mail.backends.smtp.EmailBackend" }
      - { key: EMAIL_HOST, sync: false }
      - { key: EMAIL_HOST_USER, sync: false }
      - { key: EMAIL_HOST_PASSWORD, sync: false }
      - { key: DEFAULT_FROM_EMAIL, sync: false }
