# Render Blueprint: backend only (Django API in Docker). The React app lives on Vercel and proxies /api here (docs/DEPLOY.md).
# Database is Neon (DATABASE_URL), auth is Firebase. `sync: false` secrets are asked for once in the Render dashboard.
services:
  - type: web
    name: brightloop
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: starter
    healthCheckPath: /api/healthz
    envVars:
      - { key: DEBUG, value: "false" }
      - { key: LOCAL_PASSWORD_AUTH, value: "false" }
      - { key: ODOO_ENABLED, value: "false" }
      - { key: DJANGO_SECRET_KEY, generateValue: true }
      - { key: DATABASE_URL, sync: false }          # Neon connection string (direct, not pooled), ends with ?sslmode=require
      - { key: FIREBASE_PROJECT_ID, sync: false }
      - { key: SITE_URL, sync: false }              # your Vercel URL, e.g. https://brightloop.vercel.app
      - { key: CSRF_TRUSTED_ORIGINS, sync: false }  # same Vercel URL (comma-separate extra domains)
      # demo values (shown on the sign-up page for now); replace with long random strings before real customers use this
      - { key: STAFF_SIGNUP_CODE, value: "246813" }
      - { key: ADMIN_SIGNUP_CODE, value: "123456" }
      - { key: DEMO_LOGIN_ENABLED, value: "true" }   # quick sign-in buttons for admin1/staff1/user1@gmail.com; set false to switch off
      # optional: real email (leave EMAIL_HOST empty to keep the console backend)
      - { key: EMAIL_BACKEND, value: "django.core.mail.backends.smtp.EmailBackend" }
      - { key: EMAIL_HOST, sync: false }
      - { key: EMAIL_HOST_USER, sync: false }
      - { key: EMAIL_HOST_PASSWORD, sync: false }
      - { key: DEFAULT_FROM_EMAIL, sync: false }
